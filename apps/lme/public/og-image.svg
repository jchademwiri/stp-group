<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e24"/>
      <stop offset="100%" stop-color="#2a2a32"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0898c8"/>
      <stop offset="100%" stop-color="#065a7a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04">
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="30" x2="1200" y2="30" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="90" x2="1200" y2="90" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="150" x2="1200" y2="150" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="210" x2="1200" y2="210" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="270" x2="1200" y2="270" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="330" x2="1200" y2="330" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="360" x2="1200" y2="360" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="390" x2="1200" y2="390" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="420" x2="1200" y2="420" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="450" x2="1200" y2="450" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="480" x2="1200" y2="480" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="510" x2="1200" y2="510" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="540" x2="1200" y2="540" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="570" x2="1200" y2="570" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="600" x2="1200" y2="600" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="630" x2="1200" y2="630" stroke="#fff" stroke-width="0.5"/>
  </g>

  <!-- Accent bar top -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <!-- Logo circle placeholder -->
  <circle cx="100" cy="100" r="40" fill="rgba(8,152,200,0.2)" stroke="#0898c8" stroke-width="2"/>
  <text x="100" y="108" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="700" fill="#0898c8" text-anchor="middle">LME</text>

  <!-- Company name -->
  <text x="60" y="210" font-family="Inter, system-ui, sans-serif" font-size="48" font-weight="700" fill="#ffffff" letter-spacing="-1">
    Livhu and Musa Enterprise
  </text>

  <!-- Tagline -->
  <text x="60" y="280" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="600" fill="#0898c8" letter-spacing="-0.5">
    Reliable Construction &amp; Civil Engineering
  </text>

  <!-- Subheadline -->
  <text x="60" y="340" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#a0a0a8">
    CIDB 1CE · 1GB · 1EP · Serving Gauteng Since 2014
  </text>

  <!-- CTA box -->
  <rect x="60" y="380" width="210" height="50" rx="8" fill="#0898c8"/>
  <text x="165" y="411" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">
    012 880 1893
  </text>

  <!-- Trust badges -->
  <g transform="translate(60, 470)">
    <rect x="0" y="0" width="140" height="28" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="70" y="19" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#d0d0d8" text-anchor="middle">CIDB Registered</text>

    <rect x="155" y="0" width="135" height="28" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="222" y="19" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#d0d0d8" text-anchor="middle">SARS Compliant</text>

    <rect x="305" y="0" width="140" height="28" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="375" y="19" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#d0d0d8" text-anchor="middle">Est. 2014</text>

    <rect x="460" y="0" width="180" height="28" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="550" y="19" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#d0d0d8" text-anchor="middle">City of Tshwane Supplier</text>
  </g>

  <!-- Right side abstract building graphic -->
  <g transform="translate(720, 140)" opacity="0.12">
    <rect x="0" y="60" width="60" height="140" rx="4" fill="#0898c8"/>
    <rect x="70" y="100" width="60" height="100" rx="4" fill="#0898c8"/>
    <rect x="140" y="40" width="60" height="160" rx="4" fill="#0898c8"/>
    <rect x="210" y="80" width="60" height="120" rx="4" fill="#0898c8"/>
    <rect x="280" y="120" width="60" height="80" rx="4" fill="#0898c8"/>
    <!-- skyline connector -->
    <line x1="30" y1="60" x2="310" y2="120" stroke="#0898c8" stroke-width="1"/>
  </g>

  <!-- Footer accent bar -->
  <rect x="0" y="624" width="1200" height="6" fill="url(#accent)"/>
</svg>
