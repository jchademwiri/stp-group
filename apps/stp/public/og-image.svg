<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a32"/>
      <stop offset="100%" stop-color="#1e1e24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9f1c"/>
      <stop offset="100%" stop-color="#e88f10"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04">
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="30" x2="1200" y2="30" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="90" x2="1200" y2="90" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="150" x2="1200" y2="150" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="210" x2="1200" y2="210" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="270" x2="1200" y2="270" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="330" x2="1200" y2="330" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="360" x2="1200" y2="360" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="390" x2="1200" y2="390" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="420" x2="1200" y2="420" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="450" x2="1200" y2="450" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="480" x2="1200" y2="480" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="510" x2="1200" y2="510" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="540" x2="1200" y2="540" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="570" x2="1200" y2="570" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="600" x2="1200" y2="600" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="630" x2="1200" y2="630" stroke="#fff" stroke-width="0.5"/>
  </g>

  <!-- Accent bar top -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <!-- Logo / brand -->
  <text x="60" y="90" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#ff9f1c" letter-spacing="2">
    SITHEMBE PLANT HIRE
  </text>

  <!-- Main headline -->
  <text x="60" y="210" font-family="Inter, system-ui, sans-serif" font-size="56" font-weight="700" fill="#ffffff" letter-spacing="-1">
    Equipment on site
  </text>
  <text x="60" y="280" font-family="Inter, system-ui, sans-serif" font-size="56" font-weight="700" fill="#ffffff" letter-spacing="-1">
    when you need it.
  </text>

  <!-- Subheadline -->
  <text x="60" y="340" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="400" fill="#a0a0a8">
    Construction plant hire · Grass cutting · Desludging
  </text>
  <text x="60" y="375" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="400" fill="#888890">
    Pretoria &amp; Gauteng · CIDB Registered · Fully Insured
  </text>

  <!-- CTA box -->
  <rect x="60" y="410" width="200" height="54" rx="8" fill="url(#accent)"/>
  <text x="160" y="443" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#1e1e24" text-anchor="middle">
    079 758 1297
  </text>

  <!-- Footer accent bar -->
  <rect x="0" y="624" width="1200" height="6" fill="url(#accent)"/>

  <!-- Trust badges mini -->
  <g transform="translate(60, 500)">
    <rect x="0" y="0" width="130" height="28" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="65" y="19" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#d0d0d8" text-anchor="middle">CIDB Registered</text>

    <rect x="145" y="0" width="155" height="28" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="222" y="19" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#d0d0d8" text-anchor="middle">Public Liability Insured</text>

    <rect x="315" y="0" width="135" height="28" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="382" y="19" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#d0d0d8" text-anchor="middle">COIDA Registered</text>
  </g>

  <!-- Right side graphic - abstract equipment shapes -->
  <g transform="translate(720, 180)" opacity="0.15">
    <rect x="0" y="0" width="380" height="260" rx="16" fill="none" stroke="#ff9f1c" stroke-width="2"/>
    <rect x="20" y="20" width="340" height="40" rx="6" fill="#ff9f1c"/>
    <rect x="20" y="75" width="200" height="30" rx="4" fill="rgba(255,255,255,0.3)"/>
    <circle cx="340" cy="90" r="20" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <rect x="20" y="120" width="340" height="8" rx="2" fill="rgba(255,255,255,0.15)"/>
    <rect x="20" y="140" width="340" height="8" rx="2" fill="rgba(255,255,255,0.15)"/>
    <rect x="20" y="160" width="120" height="8" rx="2" fill="rgba(255,255,255,0.15)"/>
    <!-- Wheels -->
    <circle cx="120" cy="240" r="24" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3"/>
    <circle cx="300" cy="240" r="24" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3"/>
  </g>
</svg>
